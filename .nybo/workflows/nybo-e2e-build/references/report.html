<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e2e-evidence report</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #10161d; --panel2: #141c25; --border: #1f2a37;
    --text: #e5e7eb; --muted: #8b98a9; --green: #22c55e; --red: #ef4444;
    --amber: #f59e0b; --accent: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0; }
  header .logo { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
  header .logo span { color: var(--green); }
  header .meta { color: var(--muted); font-size: 12px; }
  .passbar { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .passbar .bar { width: 180px; height: 6px; border-radius: 999px; background: #2a1215; overflow: hidden; }
  .passbar .bar i { display: block; height: 100%; background: var(--green); }
  main { display: grid; grid-template-columns: 300px minmax(340px, 1fr) minmax(420px, 1.25fr); flex: 1; min-height: 0; }
  section { border-right: 1px solid var(--border); overflow-y: auto; min-height: 0; }
  section:last-child { border-right: none; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 14px 16px 8px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  /* left: case list */
  .case { display: flex; gap: 10px; align-items: flex-start; padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent; }
  .case:hover { background: var(--panel); }
  .case.sel { background: var(--panel2); border-left-color: var(--green); }
  .case .id { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .case .t { font-size: 13px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; margin-top: 2px; display: grid; place-items: center; font-size: 10px; color: #04110a; font-weight: 800; }
  .dot.passed { background: var(--green); }
  .dot.failed { background: var(--red); color: #2a0505; }
  .dot.skipped { background: #374151; color: #cbd5e1; }
  /* center: steps */
  .casehead { padding: 14px 18px 6px; }
  .casehead .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .pill.passed { background: rgba(34,197,94,.12); color: var(--green); }
  .pill.failed { background: rgba(239,68,68,.12); color: var(--red); }
  .casehead h1 { font-size: 17px; margin: 8px 0 4px; }
  .casehead p { color: var(--muted); font-size: 13px; }
  .steps { padding: 12px 18px 24px; display: flex; flex-direction: column; gap: 10px; }
  .step { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .step:hover { border-color: #2c3a4d; }
  .step.sel { border-color: var(--green); background: var(--panel2); }
  .step.failed { border-color: rgba(239,68,68,.55); background: rgba(239,68,68,.06); }
  .step.failed.sel { border-color: var(--red); }
  .step .top { display: flex; gap: 10px; align-items: baseline; }
  .step .n { color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .step .desc { font-size: 13.5px; }
  .step .sub { color: var(--muted); font-size: 11.5px; margin-top: 4px; display: flex; gap: 12px; }
  .step .err { margin-top: 8px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #fda4af; background: rgba(239,68,68,.08); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }
  .step.skipped { opacity: .45; }
  /* right: evidence */
  .evidence { padding: 14px 18px 32px; display: flex; flex-direction: column; gap: 16px; }
  .evidence .label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  figure { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  figure img, figure video { display: block; width: 100%; height: auto; }
  figcaption { padding: 8px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
  .selrow { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
  .selrow code { font: 12px ui-monospace, Menlo, monospace; color: var(--accent); overflow-wrap: anywhere; }
  .selrow button { margin-left: auto; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .selrow button:hover { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; }
  .hint code { color: var(--text); font: 11.5px ui-monospace, Menlo, monospace; background: var(--panel); padding: 2px 6px; border-radius: 6px; }
  .empty { color: var(--muted); padding: 24px 18px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="logo">e2e<span>·evidence</span></div>
  <div class="meta" id="meta"></div>
  <div class="passbar"><span id="passtext"></span><div class="bar"><i id="passfill"></i></div></div>
</header>
<main>
  <section id="left"><h2>Tests</h2><div id="cases"></div></section>
  <section id="center"><h2>Steps</h2><div id="casehead" class="casehead"></div><div id="steps" class="steps"></div></section>
  <section id="right"><h2 id="evtitle">Evidence</h2><div id="evidence" class="evidence"></div></section>
</main>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const R = DATA.results;
let selCase = null, selStep = null;

const icon = (s) => s === 'passed' ? '✓' : s === 'failed' ? '✕' : '○';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmtMs(ms) { return ms >= 1000 ? (ms/1000).toFixed(1) + 's' : ms + 'ms'; }

function renderHeader() {
  const passed = R.cases.filter(c => c.status === 'passed').length;
  document.getElementById('meta').textContent =
    `${R.project ? R.project + ' · ' : ''}${R.baseUrl} · run ${R.runId}`;
  document.getElementById('passtext').textContent = `${passed}/${R.cases.length} passed`;
  document.getElementById('passfill').style.width = (R.cases.length ? (passed / R.cases.length) * 100 : 0) + '%';
}

function renderCases() {
  const el = document.getElementById('cases');
  el.innerHTML = R.cases.map((c, i) => `
    <div class="case ${i === selCase ? 'sel' : ''}" onclick="pickCase(${i})">
      <div class="dot ${c.status}">${icon(c.status)}</div>
      <div><span class="id">${esc(c.id)}</span> <span class="t">${esc(c.title)}</span></div>
    </div>`).join('');
}

function renderSteps() {
  const c = R.cases[selCase];
  const head = document.getElementById('casehead');
  const el = document.getElementById('steps');
  if (!c) { head.innerHTML = ''; el.innerHTML = '<div class="empty">Select a test case</div>'; return; }
  head.innerHTML = `
    <span class="pill ${c.status}">${icon(c.status)} ${c.status === 'passed' ? 'Pass' : 'Fail'}</span>
    <h1>${esc(c.id)} — ${esc(c.title)}</h1>
    ${c.requirement ? `<p>${esc(c.requirement)}</p>` : ''}`;
  el.innerHTML = (c.steps || []).map((s, i) => `
    <div class="step ${s.status} ${i === selStep ? 'sel' : ''}" onclick="pickStep(${i});event.stopPropagation()">
      <div class="top"><span class="n">Step ${s.n} ${icon(s.status)}</span><span class="desc">${esc(s.description)}</span></div>
      <div class="sub">${s.selector ? `<span><code>${esc(s.selector)}</code></span>` : ''}<span>${fmtMs(s.durationMs || 0)}</span></div>
      ${s.error ? `<div class="err">${esc(s.error)}</div>` : ''}
    </div>`).join('') || '<div class="empty">No steps recorded</div>';
}

function renderEvidence() {
  const c = R.cases[selCase];
  const el = document.getElementById('evidence');
  const title = document.getElementById('evtitle');
  if (!c) { el.innerHTML = '<div class="empty">Select a test case to see its evidence</div>'; title.textContent = 'Evidence'; return; }
  const s = (c.steps || [])[selStep];
  title.textContent = s ? `Preview: Step ${s.n}` : 'Evidence';
  let html = '';
  if (s) {
    if (s.selector) html += `
      <div class="selrow"><span class="label">Selector</span><code>${esc(s.selector)}</code>
        <button onclick="navigator.clipboard.writeText(${JSON.stringify(String(s.selector || ''))})">Copy</button></div>`;
    for (const shot of s.screenshots || []) {
      html += `<figure><img src="${esc(shot)}" loading="lazy" alt="">
        <figcaption><span>${esc(shot.split('/').pop())}</span><span>${esc(s.description)}</span></figcaption></figure>`;
    }
    if (s.dom) html += `<div class="hint">DOM snapshot at failure: <a href="${esc(s.dom)}" target="_blank">${esc(s.dom.split('/').pop())}</a></div>`;
    if (!(s.screenshots || []).length && !s.dom) html += '<div class="empty">No evidence captured for this step</div>';
  }
  html += `<div class="label">Session replay — ${esc(c.id)}</div>`;
  if (c.video) html += `<figure><video src="${esc(c.video)}" controls preload="metadata"></video>
    <figcaption><span>video.webm</span><span>${fmtMs(c.durationMs || 0)} total</span></figcaption></figure>`;
  else html += '<div class="empty">No video for this case</div>';
  if (c.trace) html += `<div class="hint">Interactive step-by-step replay: <code>npx playwright show-trace ${esc(c.trace)}</code> (run from this folder)</div>`;
  el.innerHTML = html;
}

function pickCase(i) {
  selCase = i;
  const c = R.cases[i];
  selStep = (c.steps || []).findIndex(s => s.status === 'failed');
  if (selStep < 0) selStep = (c.steps || []).length ? 0 : null;
  renderAll();
}
function pickStep(i) { selStep = i; renderSteps(); renderEvidence(); }
function renderAll() { renderHeader(); renderCases(); renderSteps(); renderEvidence(); }

if (R.cases.length) pickCase(Math.max(R.cases.findIndex(c => c.status === 'failed'), 0));
renderAll();
</script>
</body>
</html>
