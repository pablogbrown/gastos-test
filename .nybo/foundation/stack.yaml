appKind: fullstack
frontend: React
backend: Python
database: PostgreSQL
hosting: AWS
framework: react
language: python
monorepo:
  is_monorepo: false
  subprojects:
    - name: root
      path: .
dev_runbook:
  discovered_at: '2026-09-11'
  subprojects:
    - name: root
      path: .
      run_targets:
        - name: docker-dev
          command: make up
          description: >-
            Dockerized dev stack (db + backend on :8000 with --reload +
            frontend on :5173). Discovered during /nybo-verify --auto for
            fix-membresia-duplicada-actor-2026-09-14 (2026-09-14) — see
            .nybo/memory/domains/testing.md [TEST-01] for the full recipe
            (auth, seeding, cold start).
      test_commands:
        backend: .venv/bin/python -m pytest tests/
        frontend_test: npm run test
        frontend_build: npm run build
        frontend_lint: npm run lint
      auth:
        found: true
        how_to: >-
          POST /auth/registro {email,password,nombre?} -> 201, then POST
          /auth/login {email,password} -> {access_token}; send as
          "Authorization: Bearer <access_token>".
quality_tools:
  coverage:
    tool: null
    checkedAt: '2026-09-11'
  lint:
    tool: null
    checkedAt: '2026-09-11'
  complexity:
    tool: null
    checkedAt: '2026-09-11'
  duplication:
    tool: jscpd
    checkedAt: '2026-09-11'
  security:
    tool: null
    checkedAt: '2026-09-11'
  mutation:
    tool: null
    checkedAt: '2026-09-11'
