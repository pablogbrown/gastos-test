feature: rediseno-ux-ui/specs/pantallas-casa
decisions:
  - id: D001
    class: new-dependency
    question: >-
      No hay ningún proveedor de cobertura instalado (`@vitest/coverage-v8`
      ausente; `.nybo/foundation/stack.yaml`'s `quality_tools.coverage.tool`
      es `null`, mismo gap ya reportado por `sistema-visual`'s D001), y
      `nybo.config.yaml` declara `testing.coverage_threshold: 80`. ¿Se
      instala un proveedor de cobertura para poder evaluar el threshold en
      este ciclo?
    options:
      - Instalar `@vitest/coverage-v8` (o `@vitest/coverage-istanbul`) como
        devDependency y wirearlo en `vite.config.ts`'s `test.coverage`.
      - No instalar nada este ciclo — reportar coverage como
        "unavailable — not configured" y diferir la elección de proveedor
        a un humano.
    recommendation: >-
      No instalar — `new-dependency` es una decision class que SIEMPRE
      difiere a un humano sin importar el trust level (L2 semi-autonomous
      incluido, por `resolveDecisionAuthority()`). Sigue sin resolverse
      desde `sistema-visual` (misma feature); recomendable resolverlo una
      sola vez a nivel de proyecto en vez de repetirlo spec por spec.
    assumed: >-
      Se reportó coverage como no disponible en `build-results.md`
      (Verification) y en el checkpoint de handoff; se recomienda
      `/nybo-brownfield-bootstrap --quality` como remedio pre-próximo-build
      (ya recomendado por `sistema-visual`, aún pendiente).
    blocking: false
    status: open
